name: Mantener visor despierto

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir la URL del visor
        run: |
          URL="https://dz3-visor-senamhi.share.connect.posit.cloud/"
          code=$(curl -s -o /dev/null -L --max-time 90 -w "%{http_code}" "$URL")
          echo "Respuesta HTTP: $code"
          test "$code" -lt 500
